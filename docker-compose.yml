# Local development stack. Every port is bound to 127.0.0.1: these services
# use development passwords and must not be reachable from the network.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    container_name: cota-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgresql://cota:cota@postgres:5432/cota?schema=public&options=-c%20TimeZone%3DAmerica%2FSao_Paulo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      # Links to photos and PDFs are opened by your browser, outside Docker.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      FRONTEND_BASE_URL: http://localhost:${WEB_PORT:-3001}
      CDN_BASE_URL: http://localhost:${WEB_PORT:-3001}
    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    depends_on:
      - postgres
      - redis
      - minio

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3333}/api/v1
        S3_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
    container_name: cota-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3333}/api/v1
      # .env sets PORT for the API; the web server keeps its own.
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: dev
    container_name: cota-worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cota:cota@postgres:5432/cota?schema=public&options=-c%20TimeZone%3DAmerica%2FSao_Paulo
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: cota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cota
      POSTGRES_PASSWORD: cota
      POSTGRES_DB: cota
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cota-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: bitnamilegacy/minio:2024.12.18
    container_name: cota-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-cota-dev}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cota-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"

  # Database UI for local work only: started by scripts/local-up.sh or with
  # docker compose --profile tools up adminer.
  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    container_name: cota-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-5555}:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data:
  minio-data:
