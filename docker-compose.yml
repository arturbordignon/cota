services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    container_name: crane-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgresql://crane:crane@postgres:5432/crane?schema=public&options=-c%20TimeZone%3DAmerica%2FSao_Paulo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      FRONTEND_BASE_URL: http://localhost:${WEB_PORT:-3001}
      CDN_BASE_URL: http://localhost:${WEB_PORT:-3001}
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: dev
    container_name: crane-worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://crane:crane@postgres:5432/crane?schema=public&options=-c%20TimeZone%3DAmerica%2FSao_Paulo
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: crane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crane
      POSTGRES_PASSWORD: crane
      POSTGRES_DB: crane
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crane-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: bitnamilegacy/minio:2024.12.18
    container_name: crane-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-crane-proposals-dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: crane-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  adminer:
    image: adminer:4.8.1
    container_name: crane-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-5555}:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data:
  minio-data:
