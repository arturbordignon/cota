version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crane
      POSTGRES_PASSWORD: crane
      POSTGRES_DB: crane
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crane-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2023-12-14T18-51-57Z
    container_name: crane-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: crane-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  adminer:
    image: adminer:4.8.1
    container_name: crane-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "5555:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data:
  minio-data:
