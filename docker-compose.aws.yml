version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: cota-api:latest
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3333:3333"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: cota-worker:latest
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cota
      POSTGRES_PASSWORD: cota
      POSTGRES_DB: cota
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
