# Production stack. Secrets come from .env.production (see
# .env.production.example) and from the shell for the database and Redis
# passwords; compose refuses to start when one of them is missing.
#
#   docker compose -f docker-compose.aws.yml --env-file .env.production build
#   docker compose -f docker-compose.aws.yml --env-file .env.production run --rm migrate
#   docker compose -f docker-compose.aws.yml --env-file .env.production up -d
#
# Only the API and the web app publish ports, on 127.0.0.1, for the load
# balancer or reverse proxy that terminates TLS in front of them.

x-app: &app
  restart: unless-stopped
  env_file: .env.production
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrate
    image: cota-migrate:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    image: cota-api:latest
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: runtime
    image: cota-worker:latest
    environment:
      NODE_ENV: production
      HOME: /tmp
    shm_size: 256mb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the public API address}
        S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
    image: cota-web:latest
    environment:
      NODE_ENV: production
      # .env.production sets PORT for the API; the web server keeps its own.
      PORT: "3001"
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    depends_on:
      - api

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cota}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
